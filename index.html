<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Instrument</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://unpkg.com/tone"></script>
    <script src="main.js" defer></script>

</head>
<body>
    <dialog id="intro-dialog">
        <h2>Multiplayer Synth</h2>
        <p>For two players. One player controls the left half of the keyboard, the other controls the right half.</p>
        <button id="intro-dialog-close">Play</button>
    </dialog>
    
    <header>
        <h1>Multiplayer synth</h1>
    </header>
    <main>
        <button id="test-button" data-note="c4">sound check</button>
        <button id="key-test" data-note="d4">key</button>
        <audio id="audio-track" src="./assets/audio/p-hase_Leapt.mp3" loop controls></audio>
        <button id="random-time">random</button>
        <button id="play-button">play track</button>
        <input type="range" name="osc-range" id="osc-range">
        <label for="osc-range">change osc</label>
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Augusta_Dohlmann_Wild_flowers_%281905%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
             alt="painting of flowers in a vase" id="flower-painting" data-note="a3">
    </main>
    
</body>
</html>
