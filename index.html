<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Synth</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- pinned to version 15 so a new tone release can't break the prototypes -->
    <script src="https://unpkg.com/tone@15"></script>
    <script src="main.js" defer></script>

</head>
<body>
    <dialog id="intro-dialog">
        <h2>Multiplayer Synth</h2>
        <p>Two players control the sound with one keyboard. Your notes affect each other's sound.</p>
        <button id="intro-dialog-close">Play</button>
    </dialog>
    
    <header>
        <h1>Multiplayer synth</h1>
        <h2>Mapping Prototype 3: Conflict</h2>
    </header>
    <main id="stage">
        <!-- each prototype builds its own display in here -->
    </main>
    
</body>
</html>
